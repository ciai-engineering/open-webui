[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test categories
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    mail: Mail-related tests
    api: API-related tests
    security: Security-related tests

# Test configuration
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --cov=backend
    --cov-report=term-missing
    --cov-report=html

# Coverage configuration
[coverage:run]
source = backend
omit = 
    */tests/*
    */__init__.py
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError 